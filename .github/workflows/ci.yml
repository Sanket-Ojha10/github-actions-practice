name: Java CI


on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
           java-version: '17'
           distribution: 'temurin'

      - name: run maven
        run: mvn clean test
